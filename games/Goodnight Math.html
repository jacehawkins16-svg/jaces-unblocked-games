<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>about:blank</title>
    <style>
        /* This CSS ensures the iframe takes up the whole screen and removes scrollbars */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents scrollbars on the main page */
        }
        
        iframe {
            display: block; /* Removes any default spacing below the iframe */
            width: 100vw; /* Viewport width */
            height: 100vh; /* Viewport height */
            border: none; /* Removes the default iframe border */
        }
    </style>
</head>
<body>
    <iframe src="games with files/gn-math unblocked/gn-math/index.html"></iframe>
</body>
</html>
