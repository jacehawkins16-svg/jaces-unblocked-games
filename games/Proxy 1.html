<!DOCTYPE html>
<html>
<head>
<title>Fullscreen Iframe</title>
<style>
  /* CSS to make the iframe fullscreen */
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden; /* Prevents scrollbars on the main page */
  }

  iframe {
    width: 100vw;   /* 100% of the viewport width */
    height: 100vh;  /* 100% of the viewport height */
    border: none;   /* Removes the default border */
    display: block;
  }
</style>
</head>
<body>

<iframe src="https://jaces-shuttle-unblocked-backupv1.vercel.app/" title="My Fullscreen Website"></iframe>

</body>
</html>
